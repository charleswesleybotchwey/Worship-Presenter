[workspace]
resolver = "2"
members = ["crates/wp-core", "src-tauri"]
default-members = ["crates/wp-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup", "collation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
flate2 = "1"
unicode-normalization = "0.1"
