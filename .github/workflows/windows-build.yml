# Builds the Windows installers on GitHub's Windows machines, so nobody needs Rust,
# Visual Studio or the Tauri CLI on their own PC.
#
# Every push: download them from the run's page, under "Artifacts".
# A version tag (git tag v0.1.0 && git push --tags, or "Create a new release" on
# GitHub with a tag like v0.1.0): they are attached to that GitHub Release.
#
#   Worship Presenter_<version>_x64-setup.exe          small; downloads WebView2 if missing
#   Worship Presenter_<version>_x64-setup-offline.exe  includes WebView2; for PCs without internet
name: Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # Actions → Windows installer → Run workflow: type a version (e.g. 2.1.1) to build AND
  # publish that release (the tag is made for you); leave it empty for a test build
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (e.g. 2.1.1). Leave empty for a test build."
        required: false
        default: ""

# Read-only by default; only the release job (version tags) may write.
permissions:
  contents: read

# Actions are pinned to exact commits (a tag like v4 can be moved by whoever controls it).
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    env:
      # Whisper (whisper-rs) generates its C bindings for Windows with LLVM's libclang
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Whisper built for any PC from 2013 on (AVX2), not for GitHub's own server
      # processor: "native" would use instructions (AVX-512) many church PCs lack, and
      # Windows would close the app the moment recognition started
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_AVX512: "OFF"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: LLVM for Whisper's bindings
        shell: pwsh
        run: |
          if (!(Test-Path "$env:LIBCLANG_PATH\libclang.dll")) { choco install llvm -y --no-progress }
          Get-Item "$env:LIBCLANG_PATH\libclang.dll" | Select-Object FullName, Length

      - name: Install JavaScript packages
        run: npm run setup

      - name: Version from the tag (v2.1 → 2.1.0, v2.1.3 → 2.1.3)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; v="${v#v}"
          else v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          # Windows installers need three numbers: fill in the missing ones
          IFS=. read -r a b c <<< "$v"
          v="${a:-0}.${b:-0}.${c:-0}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::The tag must look like v2.1 or v2.1.3"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # the release's tag: the pushed tag, or v + the version typed in Run workflow
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; else echo "tag=v$v" >> "$GITHUB_OUTPUT"; fi

      - name: Test
        run: cargo test --release -p wp-core -p wp-remote -p wp-audio -p wp-render

      - name: Build the installer
        shell: bash
        env:
          # automatic updates: the installer is signed with the church's private key
          # (repository secrets) and the app checks against its public key (a variable)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the public key may be saved as a variable or as a secret
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
          # a private repository cannot serve updates: set the variable RELEASES_REPO to a
          # public repository (owner/name) to publish the installers there instead
          RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            cfg=$(node -e 'const [v,k,r]=process.argv.slice(1);console.log(JSON.stringify({version:v,bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:k,endpoints:[`https://github.com/${r}/releases/latest/download/latest.json`],windows:{installMode:"passive"}}}}))' "$v" "$UPDATER_PUBKEY" "$RELEASES_REPO")
          else
            # say exactly what is missing (never the values)
            [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && echo "::warning::Automatic updates are off: the secret TAURI_SIGNING_PRIVATE_KEY is missing or empty."
            [ -z "$UPDATER_PUBKEY" ] && echo "::warning::Automatic updates are off: TAURI_UPDATER_PUBKEY is missing (add it under Variables or Secrets)."
            cfg="{\"version\":\"$v\"}"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::warning::The secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty: fine only if the key was made without a password."
          fi
          npx tauri build --config "$cfg"

      - name: Build the offline installer (WebView2 included)
        shell: bash
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          dir=target/release/bundle/nsis
          mkdir -p out
          # names without spaces (GitHub turns spaces into dots, which would break the update address)
          for f in "$dir"/*-setup.exe; do n=$(basename "$f" | tr ' ' '-'); mv "$f" "out/$n"; if [ -f "$f.sig" ]; then mv "$f.sig" "out/$n.sig"; fi; done
          # latest.json tells installed copies about this version (only when it is signed)
          if ls out/*-setup.exe.sig >/dev/null 2>&1; then
            node -e 'const fs=require("fs");const [v,r]=process.argv.slice(1);const exe=fs.readdirSync("out").find(f=>f.endsWith("-setup.exe"));const sig=fs.readFileSync("out/"+exe+".sig","utf8").trim();fs.writeFileSync("out/latest.json",JSON.stringify({version:v,notes:"Worship Presenter "+v,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:sig,url:`https://github.com/${r}/releases/download/v${v}/${exe}`}}},null,2))' "$v" "$RELEASES_REPO"
            cat out/latest.json
            echo "::notice::Signed: installed copies will be offered this version."
          else
            echo "::warning::Not signed, so no latest.json: installed copies will not see this version. See the warnings in the build step."
          fi
          npx tauri build --config "{\"version\":\"$v\",\"bundle\":{\"windows\":{\"webviewInstallMode\":{\"type\":\"offlineInstaller\"}}}}"
          for f in "$dir"/*-setup.exe; do n=$(basename "${f%.exe}" | tr ' ' '-'); mv "$f" "out/${n}-offline.exe"; done
          ls -la out

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Worship-Presenter-${{ steps.ver.outputs.version }}-Windows
          path: |
            out/*.exe
            out/latest.json
          if-no-files-found: error


  # the interface: unit tests (Vitest) and the operator workflows end to end (Playwright)
  interface-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm --prefix ui ci
      - name: Unit tests
        run: npm --prefix ui test
      - name: Build the interface
        run: npm --prefix ui run build
      - name: Operator workflows (Playwright)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  release:
    needs: [build, interface-tests]
    # a version tag, or Run workflow with a version typed in
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # this repository, or the public releases repository (RELEASES_REPO) with a token
          # that may write to it (secret RELEASES_TOKEN)
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ vars.RELEASES_REPO && secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ needs.build.outputs.tag }}
          name: Worship Presenter ${{ needs.build.outputs.tag }}
          target_commitish: ${{ vars.RELEASES_REPO && 'main' || github.sha }}
          files: |
            out/*.exe
            out/latest.json
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Windows installers for Worship Presenter ${{ needs.build.outputs.tag }}.
            - **setup.exe**: the usual installer (downloads Microsoft WebView2 only if this PC lacks it).
            - **setup-offline.exe**: for PCs without internet; includes WebView2.
            The installer is not code-signed yet: if Windows shows "Windows protected your PC", choose More info, then Run anyway.
