# Builds the Windows installers on GitHub's Windows machines, so nobody needs Rust,
# Visual Studio or the Tauri CLI on their own PC.
#
# Every push: download them from the run's page, under "Artifacts".
# A version tag (git tag v0.1.0 && git push --tags, or "Create a new release" on
# GitHub with a tag like v0.1.0): they are attached to that GitHub Release.
#
#   Worship Presenter_<version>_x64-setup.exe          small; downloads WebView2 if missing
#   Worship Presenter_<version>_x64-setup-offline.exe  includes WebView2; for PCs without internet
name: Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job (version tags) may write.
permissions:
  contents: read

# Actions are pinned to exact commits (a tag like v4 can be moved by whoever controls it).
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install JavaScript packages
        run: npm run setup

      - name: Version from the tag (v1.2.3 → 1.2.3)
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(node -p "require('./src-tauri/tauri.conf.json').version")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --release -p wp-core -p wp-remote -p wp-audio -p wp-render

      - name: Build the installer
        shell: bash
        run: npx tauri build --config "{\"version\":\"${{ steps.ver.outputs.version }}\"}"

      - name: Build the offline installer (WebView2 included)
        shell: bash
        run: |
          dir=target/release/bundle/nsis
          mkdir -p out && mv "$dir"/*-setup.exe out/
          npx tauri build --config "{\"version\":\"${{ steps.ver.outputs.version }}\",\"bundle\":{\"windows\":{\"webviewInstallMode\":{\"type\":\"offlineInstaller\"}}}}"
          for f in "$dir"/*-setup.exe; do mv "$f" "out/$(basename "${f%.exe}")-offline.exe"; done
          ls -la out

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Worship-Presenter-${{ steps.ver.outputs.version }}-Windows
          path: out/*.exe
          if-no-files-found: error


  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.exe
          draft: false
          body: |
            Windows installers for Worship Presenter ${{ steps.ver.outputs.version }}.
            - **setup.exe**: the usual installer (downloads Microsoft WebView2 only if this PC lacks it).
            - **setup-offline.exe**: for PCs without internet; includes WebView2.
            The installer is not code-signed yet: if Windows shows "Windows protected your PC", choose More info, then Run anyway.
