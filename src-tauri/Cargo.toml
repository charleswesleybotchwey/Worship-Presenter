[package]
name = "worship-presenter"
description = "Worship Presenter desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "worship_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
wp-core = { path = "../crates/wp-core" }
wp-remote = { path = "../crates/wp-remote" }
wp-audio = { path = "../crates/wp-audio" }
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture of an output window, for NDI (Phase 4 prototype)
windows-capture = "=2.0.1"
