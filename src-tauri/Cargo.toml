[package]
name = "worship-presenter"
description = "Worship Presenter desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "worship_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
wp-core = { path = "../crates/wp-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
