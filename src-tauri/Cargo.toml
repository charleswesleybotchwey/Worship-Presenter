[package]
name = "worship-presenter"
description = "Worship Presenter desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "worship_presenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
wp-core = { path = "../crates/wp-core" }
wp-remote = { path = "../crates/wp-remote" }
wp-audio = { path = "../crates/wp-audio" }
wp-render = { path = "../crates/wp-render" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Whisper speech recognition (whisper.cpp, built from source; CPU)
whisper-rs = "0.16"
# MIDI pads and keyboards as buttons (Go live, Next, Blank…)
midir = "=0.11.1"
fontdb = { version = "=0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
ttf-parser = "0.25"
cpal = "=0.18.2"
libloading = "0.8"
ureq = "2"
sha2 = "0.10"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync", "time"] }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
# automatic updates from the GitHub releases (only installers signed with the church's key)
tauri-plugin-updater = "=2.13.3"
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows.Graphics.Capture of an output window, for NDI (Phase 4 prototype)
windows-capture = "=2.0.1"
